name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: e2e k8s-${{ matrix.k8s }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # Continue tests matrix if a flaky run occurs.
      matrix:
        k8s:
          - 1.34
          - 1.35
          - 1.36

    permissions:
      id-token: write

    env:
      KUBERNETES_VERSION: ${{ matrix.k8s }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: hetznercloud/tps-action@5bfcef547f41c44aa626d0474c0491a1dbda792a # main

      - name: Install test tools
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Setup tests
        run: make e2e-setup

      - name: Run tests
        run: make e2e-coverage

      - name: upload coverage reports to codecov
        if: >
          !startswith(github.head_ref, 'renovate/') &&
          !startswith(github.head_ref, 'releaser-pleaser--')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov_token }}
